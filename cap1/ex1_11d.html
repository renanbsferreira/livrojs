<meta charset="UTF-8">
<script>
// Calcular a média de 2 notas

var nota1 = Number(prompt("Insira a nota do primeiro semestre:"));
var nota2 = Number(prompt("Insira a nota do segundo: "))
var media = (nota1 + nota2) / 2;

alert("1° Nota: " + nota1.toFixed(1) + 
"\n2° Nota: " + nota2.toFixed(1) +
"\nMédia: " + media.toFixed(1));
</script>
