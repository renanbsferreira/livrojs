<meta charset="UTF-8">
<script>
    /* Cálculo do valor do jantar */ 
    // Entrada de Dados
    var jantar = Number(prompt("Qual foi o valor do jantar?"));
    // Processamento
    var garcom = jantar * 0.1;
    var total = jantar + garcom;
    // Saída de Dados
    alert(`Taxa do garçom: R$${garcom.toFixed(2)}\nTotal: R$${total.toFixed(2)}`);
</script>
