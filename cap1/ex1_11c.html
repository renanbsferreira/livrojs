<meta charset="UTF-8">
<script>
// Opções de pagamento de uma loja

var preco = Number(prompt("Insira o preço do produto:"));
var vista = preco - (preco * 0.1);
var parcelado = preco / 3;

alert("Preço: R$" + preco.toFixed(2) +
"\nÀ vista: R$" + vista.toFixed(2) +
"\nOu 3x de: R$" + parcelado.toFixed(2));
</script>
