<meta charset="UTF-8">
<script>
// Sistema para dividir conta de uma pizzaria

var conta = Number(prompt("Qual foi o valor da sua conta?"))
var clientes = Number(prompt("E ela será divida em quantas pessoas?"))
var valorInd = conta / clientes;

alert("Valor da Conta: R$" + conta.toFixed(2)+ 
"\nNúmero de Clientes: " + clientes + 
"\nValor por Cliente: R$" + valorInd.toFixed(2));
</script>
