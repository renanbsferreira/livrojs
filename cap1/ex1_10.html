<meta charset="UTF-8">
<script>
// Calculo da duração de horas de uma viagem

//entrada de dados
var dia = Number(prompt("Quantos dias serão de viagem?"));
var hora = Number(prompt("E quantas horas?"));

//processamento
var total = (dia * 24) + hora;

//saída de dados 
alert("Nº Dias: " + dia +
"\nNº Horas: " + hora +
"\nNº Total de Horas: " + total);
</script>
